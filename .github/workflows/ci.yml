name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt -e .
      - run: make lint
      - name: Testes unitários com cobertura
        run: >
          .venv/bin/python -m pytest tests/unit
          --cov=scraper.parsers --cov=scraper.storage
          --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Instalar dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt -e .
      - name: Subir LocalStack
        run: make up
      - run: make build deploy-local test-int
      - name: Logs do LocalStack em caso de falha
        if: failure()
        run: docker compose logs localstack | tail -200
